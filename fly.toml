app = "binance-misty-cherry-6273"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"

[[mounts]]
  source = "app_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
